await test('Session partagée entre onglets : changement de compte sans mélange, déconnexion sans perte',async()=>{
 const local=storage();for(const uid of ['alice','bob'])createAthleteStore(uid,local).edit('program',{...emptyProgram(),notes:uid});
 const legacy=JSON.stringify({done:[2],score:'1',notes:'historique'}),f=await fixture('program',{seeds:{...Object.fromEntries(local.map),'tractions-v2':legacy}});
 try{
  f.options.selection.write('bob');f.frame.contentWindow.dispatchEvent(new StorageEvent('storage',{key:'tractions-active-athlete-v1'}));assert(f.$('notes').value==='bob','changement ignoré');
  f.options.selection.write(null);f.frame.contentWindow.dispatchEvent(new StorageEvent('storage',{key:'tractions-active-athlete-v1'}));assert(f.$('notes').value==='historique'&&f.storage.getItem('tractions-v2')===legacy,'déconnexion');
  assert(JSON.parse(f.storage.getItem('tractions-athlete-v1:alice')).documents.program.value.notes==='alice','Alice écrasée');
 }finally{f.close()}
});
