<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<meta name="referrer" content="no-referrer"><title>Essai local — vérification du courriel</title>
<style>body{font:16px system-ui;max-width:640px;margin:32px auto;padding:16px}label{display:block;margin-top:16px}input,button{font:inherit;padding:10px;margin:8px 0}input{box-sizing:border-box;width:100%}button{cursor:pointer}p{line-height:1.5}</style>
</head><body>
<h1>Vérification du courriel — essai local</h1>
<noscript><p>JavaScript est désactivé : le formulaire reste visible, mais la connexion et l’envoi sont désactivés.</p></noscript>
<p>Compte Firebase existant uniquement. Aucune création de compte et aucun accès Firestore. Cette page ne donne aucun rôle coach.</p>
<form id="login" autocomplete="off">
<label for="email">Adresse e-mail du compte existant</label><input id="email" type="email" autocomplete="off" required disabled>
<label for="password">Mot de passe</label><input id="password" type="password" autocomplete="off" required disabled>
<button id="connect" disabled>Se connecter</button>
</form>
<p id="identity">Aucune session.</p>
<p id="verified">État non consulté.</p>
<label><input id="confirm" type="checkbox" disabled> Je confirme vouloir envoyer un véritable e-mail de vérification à ce compte.</label>
<button id="send" type="button" disabled>Envoyer l’e-mail de vérification</button>
<button id="refresh" type="button" disabled>Actualiser l’état du compte</button>
<button id="disconnect" type="button" disabled>Se déconnecter</button>
<p id="status" role="status" aria-live="polite">Essai réservé à une origine locale. Aucune action automatique.</p>
<script type="module">
const local = ['127.0.0.1','localhost','[::1]'].includes(location.hostname) && ['http:','https:'].includes(location.protocol);
if (!local) document.getElementById('status').textContent='Page désactivée : ouvrez-la via le serveur HTTP local dédié. Aucun SDK Firebase chargé.';
else {
  try {
    const { mountVerificationPage } = await import('./email-verification-controller.js');
    mountVerificationPage(document);
  } catch {
    document.getElementById('status').textContent='Impossible de charger la page de vérification. Aucune opération lancée.';
  }
}
</script></body></html>
