<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Mon compte — Objectif 5 tractions</title><link rel="stylesheet" href="multisport.css"></head>
<body><main><a href="index.html">← Revenir au programme</a><h1 id="account-title">Mon compte sportif</h1>
<section id="credentials"><form id="login">
<label id="pseudo-label" hidden>Pseudo<input id="display-name" maxlength="100" autocomplete="nickname"></label>
<label>Adresse e-mail<input id="email" type="email" autocomplete="email" required></label>
<label>Mot de passe<input id="password" type="password" minlength="6" autocomplete="current-password" required></label>
<button id="submit" type="submit">Se connecter</button></form>
<p><a href="#" id="mode-toggle">Créer mon compte avec mon invitation</a></p></section>
<section id="account-state" hidden><p id="identity"></p><p id="admission-status"></p>
<a id="open-program" href="index.html" hidden>Ouvrir mes séances</a>
<button id="resend" type="button" hidden>Renvoyer l’e-mail de vérification</button>
<button id="retry" type="button" hidden>Réessayer</button>
<button id="logout" type="button">Me déconnecter</button></section>
<p id="status" role="status" aria-live="polite">Connexion à votre espace…</p>
<p class="small">Sur un appareil partagé, déconnectez-vous après utilisation. Vos résultats sont conservés séparément pour chaque compte.</p>
</main><script type="module" src="js/athlete-page.js"></script></body></html>
